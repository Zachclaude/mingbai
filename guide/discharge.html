<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出院后先问什么？ | 明白</title><meta name="description" content="整理出院资料，问清复诊和出院后的安排。"><link rel="canonical" href="https://zachclaude.github.io/mingbai/guide/discharge.html"><style>body{margin:0;background:#f8f5ef;color:#282521;font:18px/1.8 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}main{max-width:720px;margin:auto;padding:32px 22px 60px}a{color:#782a20}h1{font-size:2em;line-height:1.4}li{margin:12px 0}.go{display:inline-block;margin:18px 0;padding:12px 20px;background:#87372b;color:white;border-radius:4px;text-decoration:none;font-weight:700}.note{border-left:4px solid #87372b;background:#f8ede6;padding:12px 16px}.source{font-size:.9em}a:focus-visible{outline:3px solid #87372b;outline-offset:3px}</style></head><body><main><a href="../">← 返回明白首页</a><p>明白 · 办事小提示</p><h1>出院后先问什么？</h1><p>整理出院资料，问清复诊和出院后的安排。</p><ol><li>留好医院给的出院小结和相关资料。</li><li>向医生或护士问清复诊时间、地点和注意事项。</li><li>用药或身体状况有疑问时，直接问医生或药师。</li></ol><p class="note">每个人和每个地方的情况可能不同；请以通知原文及当地经办机构或医护人员的答复为准。</p><a class="go" href="../?topic=discharge">整理成我的办事纸 →</a><p class="source">参考：<a href="https://www.nhc.gov.cn/wjw/c100376/202308/ddc2ac553ee64d378016ba5e8338b0d4.shtml">国家卫生健康委：改善医疗服务有关文件</a></p><p class="source">无需注册，办事纸在您的设备上整理。</p></main></body></html>
