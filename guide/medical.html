<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医保报销先准备什么？ | 明白</title><meta name="description" content="报销方式和所需材料会因当地规定及就医情况不同，请先确认。"><link rel="canonical" href="https://zachclaude.github.io/mingbai/guide/medical.html"><style>body{margin:0;background:#f8f5ef;color:#282521;font:18px/1.8 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}main{max-width:720px;margin:auto;padding:32px 22px 60px}a{color:#782a20}h1{font-size:2em;line-height:1.4}li{margin:12px 0}.go{display:inline-block;margin:18px 0;padding:12px 20px;background:#87372b;color:white;border-radius:4px;text-decoration:none;font-weight:700}.note{border-left:4px solid #87372b;background:#f8ede6;padding:12px 16px}.source{font-size:.9em}a:focus-visible{outline:3px solid #87372b;outline-offset:3px}</style></head><body><main><a href="../">← 返回明白首页</a><p>明白 · 办事小提示</p><h1>医保报销先准备什么？</h1><p>报销方式和所需材料会因当地规定及就医情况不同，请先确认。</p><ol><li>先问清是否需要手工报销、在哪里办理。</li><li>票据、费用清单和就医资料是否需要，请向经办机构核对。</li><li>提交后询问如何查询进度和结果。</li></ol><p class="note">每个人和每个地方的情况可能不同；请以通知原文及当地经办机构或医护人员的答复为准。</p><a class="go" href="../?topic=medical">整理成我的办事纸 →</a><p class="source">参考：<a href="https://www.nhsa.gov.cn/module/download/downfile.jsp?classid=0&filename=831d2a2f9d4349afa0aac9f1a4df19e4.pdf">国家医保局：医保政策问答手册（具体材料以当地最新要求为准）</a></p><p class="source">无需注册，办事纸在您的设备上整理。</p></main></body></html>
