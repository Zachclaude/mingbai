<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>养老金资格认证怎么问？ | 明白</title><meta name="description" content="先向当地社保经办机构确认自己是否需要认证、什么时候办理。"><link rel="canonical" href="https://zachclaude.github.io/mingbai/guide/pension.html"><style>body{margin:0;background:#f8f5ef;color:#282521;font:18px/1.8 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}main{max-width:720px;margin:auto;padding:32px 22px 60px}a{color:#782a20}h1{font-size:2em;line-height:1.4}li{margin:12px 0}.go{display:inline-block;margin:18px 0;padding:12px 20px;background:#87372b;color:white;border-radius:4px;text-decoration:none;font-weight:700}.note{border-left:4px solid #87372b;background:#f8ede6;padding:12px 16px}.source{font-size:.9em}a:focus-visible{outline:3px solid #87372b;outline-offset:3px}</style></head><body><main><a href="../">← 返回明白首页</a><p>明白 · 办事小提示</p><h1>养老金资格认证怎么问？</h1><p>先向当地社保经办机构确认自己是否需要认证、什么时候办理。</p><ol><li>问清认证时间和可用的办理方式。</li><li>如果不方便自己操作，可以询问家人协助或线下办理的方式。</li><li>办完后询问如何确认认证结果。</li></ol><p class="note">每个人和每个地方的情况可能不同；请以通知原文及当地经办机构或医护人员的答复为准。</p><a class="go" href="../?topic=pension">整理成我的办事纸 →</a><p class="source">参考：<a href="https://www.beijing.gov.cn/fuwu/bmfw/sy/jrts/202411/t20241126_3949922.html">北京市政府：养老保险资格认证的相关说明（地方示例）</a></p><p class="source">无需注册，办事纸在您的设备上整理。</p></main></body></html>
