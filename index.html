<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>明白 · 把通知贴进来，变成一张能带走的清单。</title>
<meta name="description" content="把办事通知原文贴进来，自动挑出日期、地点、要带的材料，排成一张能打印、能核对的清单。离线、不上传。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2322456b'/%3E%3Ctext x='32' y='45' font-family='Microsoft YaHei,PingFang SC,sans-serif' font-size='36' font-weight='700' text-anchor='middle' fill='%23ffffff'%3E明%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#faf8f4; --sheet:#fffdf9; --ink:#1c1b19; --ink2:#43413c; --ink3:#6b665e;
    --rule:#e3ded4; --rule2:#efeae0; --rule3:#cfc8bb;
    --blue:#22456b; --blue-ink:#16324f; --blue-wash:#edf1f6; --blue-line:#c9d6e5;
    --amber:#7a5312; --amber-wash:#fbf4e6;
    --red:#8f2f22; --red-wash:#fbefec;
    --green:#2c5a41; --green-wash:#eef4ef;
    --fs:18px;
    --serif:"Songti SC","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,"Times New Roman",serif;
    --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  html[data-fs="lg"]{--fs:21px}
  html[data-fs="xl"]{--fs:25px}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs)/1.78 var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  a{color:var(--blue)}
  :focus-visible{outline:2px solid var(--blue);outline-offset:3px}
  h1:focus,h1:focus-visible,h2:focus,h2:focus-visible{outline:none}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .page{max-width:980px;margin:0 auto;padding:0 32px 80px}
  .view[hidden]{display:none}
  [hidden]{display:none!important}
  @media(max-width:640px){.page{padding:0 20px 64px}}

  /* ---------- masthead ---------- */
  .masthead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:26px 0 18px;border-bottom:1px solid var(--rule)}
  .brand{display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
  .wordmark{font-family:var(--serif);font-size:1.55em;font-weight:700;letter-spacing:.14em;color:var(--blue-ink);line-height:1}
  .brand-sub{font-size:.72em;letter-spacing:.22em;color:var(--ink3)}
  .controls{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .ctl-group{display:inline-flex;align-items:center;gap:2px}
  .ctl-label{font-size:.72em;letter-spacing:.14em;color:var(--ink3);margin-right:4px}
  .ctl{background:none;border:0;padding:8px 9px;color:var(--ink2);font-size:.84em;cursor:pointer;border-bottom:1px solid transparent;min-height:40px}
  .ctl:hover{color:var(--ink)}
  .ctl[aria-pressed="true"]{color:var(--blue-ink);border-bottom-color:var(--blue);font-weight:700}
  @media(max-width:640px){
    .masthead{flex-wrap:wrap;row-gap:8px}
    .brand{width:100%}
    .controls{width:100%;justify-content:space-between;gap:10px}
    h1{font-size:1.68em;line-height:1.38}
    .pagehead h1{font-size:1.6em}
  }

  /* ---------- type ---------- */
  .eyebrow{margin:0 0 14px;font-size:.7em;letter-spacing:.26em;color:var(--ink3)}
  h1{margin:0;font-family:var(--serif);font-size:2.02em;line-height:1.42;font-weight:600;letter-spacing:.01em}
  .lede{margin:16px 0 0;color:var(--ink2);font-size:.97em;max-width:29em}
  .fineprint{font-size:.82em;color:var(--ink3);line-height:1.7}
  .sec-label{margin:0 0 14px;font-size:.72em;font-weight:700;letter-spacing:.2em;color:var(--ink3)}
  .section{border-top:1px solid var(--rule);margin-top:40px;padding-top:26px}
  .quiet{color:var(--ink2)}

  /* ---------- buttons ---------- */
  .btn-primary{display:inline-flex;align-items:center;justify-content:center;background:var(--blue);border:1px solid var(--blue);color:#fff;border-radius:2px;min-height:54px;padding:0 26px;font-size:1em;font-weight:600;letter-spacing:.02em;cursor:pointer}
  .btn-primary:hover{background:var(--blue-ink);border-color:var(--blue-ink)}
  .btn-quiet{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--rule3);color:var(--ink2);border-radius:2px;min-height:54px;padding:0 20px;font-size:.94em;cursor:pointer}
  .btn-quiet:hover{border-color:var(--blue);color:var(--blue-ink)}
  .cta .btn-quiet{min-height:54px}
  .linkbtn{background:none;border:0;padding:6px 0;color:var(--blue);text-decoration:underline;text-underline-offset:4px;cursor:pointer;font-size:.9em;min-height:44px}
  .textbtn{background:none;border:0;padding:10px 2px;color:var(--ink2);cursor:pointer;font-size:.9em;display:inline-flex;align-items:center;gap:7px;min-height:44px}
  .textbtn:hover{color:var(--blue-ink)}
  .textbtn svg{flex:none}
  @media(max-width:640px){
    .cta{display:grid;gap:8px}
    .cta .btn-primary{width:100%}
    .cta .btn-quiet{justify-self:start;padding:8px 0}
  }

  /* ---------- home ---------- */
  .home-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:64px;padding:52px 0 8px;align-items:start}
  @media(max-width:900px){.home-grid{grid-template-columns:1fr;gap:34px;padding-top:36px}}
  .home-lead .cta{margin-top:30px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .home-lead .fineprint{margin-top:18px;max-width:26em}

  /* the sample sheet: the core visual image */
  .sample{background:var(--sheet);border:1px solid var(--rule3);border-radius:2px;padding:30px 28px 24px;position:relative}
  .sample::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--blue)}
  .sample-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .sample-tag{font-size:.68em;letter-spacing:.2em;color:var(--blue-ink);border:1px solid var(--blue-line);background:var(--blue-wash);padding:2px 7px;border-radius:2px}
  .sample-title{font-size:.76em;letter-spacing:.18em;color:var(--ink3)}
  .sample-date{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;margin:14px 0 16px;padding-bottom:14px;border-bottom:1px solid var(--rule2)}
  .sample-date .d{font-family:var(--serif);font-size:1.45em;font-weight:600;color:var(--ink)}
  .sample-date .t{font-size:.8em;color:var(--ink3)}
  .sample-sec{margin:16px 0 0}
  .sample-sec h3{margin:0 0 8px;font-size:.68em;font-weight:700;letter-spacing:.2em;color:var(--ink3)}
  .sample-lines{list-style:none;margin:0;padding:0}
  .sample-lines li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:.92em;line-height:1.5}
  .tick{width:17px;height:17px;flex:none;border:1px solid var(--ink3);border-radius:1px;margin-top:.3em;position:relative}
  .tick.on{background:var(--green);border-color:var(--green)}
  .tick.on::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:9px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
  .sample-bring{margin:0;font-size:.9em;color:var(--ink2);line-height:1.9;display:flex;flex-wrap:wrap;gap:0 2px}
  .sample-bring .it{white-space:nowrap}
  .sample-bring .sep{color:var(--rule3);margin:0 .45em}
  .sample-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule2);font-size:.8em;color:var(--ink3)}
  .sample-foot b{font-weight:600;color:var(--amber)}

  /* contents list */
  .toc{list-style:none;margin:0;padding:0}
  .toc li{border-bottom:1px solid var(--rule2)}
  .toc button{display:grid;grid-template-columns:2.2em 1fr auto;align-items:baseline;gap:14px;width:100%;text-align:left;background:none;border:0;padding:16px 2px;cursor:pointer;min-height:56px}
  .toc button:hover .toc-name{color:var(--blue-ink)}
  .toc button[aria-pressed="true"]{box-shadow:inset 2px 0 0 var(--blue);padding-left:12px}
  .toc button[aria-pressed="true"] .toc-name{color:var(--blue-ink)}
  .toc-no{font-size:.76em;color:var(--ink3);letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .toc-name{font-size:1em;font-weight:600;color:var(--ink)}
  .toc-desc{display:block;font-size:.82em;font-weight:400;color:var(--ink3);margin-top:2px}
  .toc-tag{font-size:.72em;color:var(--ink3);letter-spacing:.1em;white-space:nowrap}

  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
  @media(max-width:760px){.how{grid-template-columns:1fr;gap:14px}}
  .how-step{border-top:1px solid var(--rule2);padding-top:12px}
  .how-step b{display:block;font-size:.95em;font-weight:600;margin-bottom:3px}
  .how-step span{display:block;font-size:.86em;color:var(--ink3);line-height:1.65}

  .trust{font-size:.82em;color:var(--ink3);line-height:1.8}
  .trust b{display:block;color:var(--ink2);font-weight:600}

  details.about{margin-top:26px;border-top:1px solid var(--rule2);padding-top:14px}
  details.about summary{cursor:pointer;font-size:.84em;color:var(--ink2);list-style:none;text-decoration:underline;text-underline-offset:4px}
  details.about summary::-webkit-details-marker{display:none}
  details.about .body{margin-top:12px;font-size:.85em;color:var(--ink2);line-height:1.8;max-width:44em}
  details.about h4{margin:16px 0 4px;font-size:.95em;color:var(--ink)}
  details.about ul{margin:4px 0 0;padding-left:1.2em}
  details.about li{margin:3px 0}

  /* ---------- page heads ---------- */
  .backlink{display:inline-flex;align-items:center;gap:6px;margin:20px 0 0;background:none;border:0;padding:6px 0;color:var(--ink2);font-size:.85em;cursor:pointer;min-height:44px}
  .backlink:hover{color:var(--blue-ink)}
  .pagehead{padding:24px 0 0}
  .pagehead h1{font-size:1.9em}
  .pagehead .lede{max-width:34em}

  /* ---------- task page ---------- */
  .task-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:24px 0 20px;border-bottom:1px solid var(--rule)}
  @media(max-width:700px){.task-head{grid-template-columns:1fr}}
  .task-kind{font-size:.72em;letter-spacing:.24em;color:var(--ink3);margin:0 0 10px}
  .task-date{font-family:var(--serif);font-size:2.4em;line-height:1.22;font-weight:600;margin:0}
  .task-date.over{color:var(--red)}
  .task-date small{display:block;font-family:var(--sans);font-size:.4em;font-weight:400;color:var(--ink3);letter-spacing:.02em;margin-top:8px;line-height:1.6}
  .task-meta{font-size:.86em;color:var(--ink2);text-align:right;line-height:1.9}
  @media(max-width:700px){.task-meta{text-align:left}}
  .task-meta .lab{font-size:.74em;letter-spacing:.14em;color:var(--ink3);display:block;margin-bottom:1px}
  .task-meta strong{font-weight:600;display:block}

  .next{border-left:3px solid var(--blue);background:var(--sheet);padding:22px 26px;margin:28px 0 0}
  .next .lab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:.7em;letter-spacing:.22em;color:var(--blue-ink);margin-bottom:8px}
  .next .lab .when{letter-spacing:.02em;color:var(--ink3);font-size:1.05em}
  .next.done{border-left-color:var(--green)}
  .next.done .lab{color:var(--green)}
  .next h2{margin:0;font-size:1.2em;font-weight:600;line-height:1.5}
  .next p{margin:8px 0 0;font-size:.9em;color:var(--ink2);line-height:1.7}
  .next .askline{margin:10px 0 0;font-size:.86em;color:var(--amber)}

  .group{margin-top:38px;border-top:1px solid var(--rule);padding-top:22px}
  .group-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:4px}
  .group-head .sec-label{margin:0}
  .count{font-size:.8em;color:var(--ink3);font-variant-numeric:tabular-nums}

  .schedule{list-style:none;margin:0;padding:0}
  .sched-item{display:grid;grid-template-columns:5.4em 1fr;gap:16px;align-items:start;padding:15px 0;border-bottom:1px solid var(--rule2);cursor:pointer;position:relative}
  .sched-item:last-child{border-bottom:0}
  .sched-when{font-size:.78em;color:var(--ink3);padding-top:.3em;font-variant-numeric:tabular-nums}
  .sched-when.over{color:var(--red);font-weight:600}
  .sched-body{min-width:0}
  .sched-title{display:flex;gap:11px;align-items:flex-start;font-size:1em;font-weight:600;line-height:1.55}
  .sched-title .tick{margin-top:.3em}
  .sched-hint{display:block;margin:4px 0 0 26px;font-size:.86em;color:var(--ink2);line-height:1.65}
  .sched-note{display:block;margin:4px 0 0 26px;font-size:.82em;color:var(--amber);line-height:1.6}
  .sched-item.done{opacity:.55}
  .sched-item.done .sched-title{text-decoration:line-through;text-decoration-thickness:1px}
  input.hidden-box{position:absolute;opacity:0;width:1px;height:1px}
  input.hidden-box:focus-visible + .sched-body .tick{outline:2px solid var(--blue);outline-offset:3px}

  .flatlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 28px}
  @media(max-width:640px){.flatlist{grid-template-columns:1fr}}
  .flatlist li{display:flex;gap:10px;align-items:flex-start;font-size:.94em;line-height:1.65;padding:6px 0}
  .flatlist .tick{margin-top:.3em}

  .confirmlist{list-style:none;margin:0;padding:0}
  .confirmlist li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule2);font-size:.94em;line-height:1.65}
  .confirmlist li:last-child{border-bottom:0}
  .confirmlist .q{color:var(--amber);font-weight:700;font-size:.82em;letter-spacing:.06em;white-space:nowrap;padding-top:.15em}

  .actions{margin-top:34px;border-top:1px solid var(--rule);padding-top:22px;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
  .actions .spacer{flex:1}
  @media(max-width:640px){.actions{display:grid;gap:12px}.actions .btn-primary{width:100%}}
  .more{margin-top:14px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
  .more .mlabel{font-size:.78em;color:var(--ink3);letter-spacing:.14em}
  .editline{margin-top:20px;font-size:.86em;color:var(--ink3)}
  .voice{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:16px;font-size:.8em;color:var(--ink3)}
  .voice label{display:inline-flex;align-items:center;gap:8px}
  .voice select{font:inherit;font-size:1em;padding:6px 8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:2px;min-height:40px;max-width:20em}
  .note{border-left:2px solid var(--blue-line);padding:2px 0 2px 14px;font-size:.86em;color:var(--ink2);margin:16px 0 0;line-height:1.7}
  .banner{margin:16px 0 0;padding:12px 16px;border:1px solid #bcd0c2;background:var(--green-wash);font-size:.86em;color:#244c37;display:flex;gap:12px;align-items:flex-start}
  .banner[hidden]{display:none}
  .banner button{margin-left:auto;background:none;border:0;color:#244c37;text-decoration:underline;cursor:pointer;flex:none;font-size:.92em}

  /* ---------- letter / form ---------- */
  .typebody{margin-top:38px}
  .typebody h2{font-size:.72em;font-weight:700;letter-spacing:.2em;color:var(--ink3);margin:0 0 12px;font-family:var(--sans)}
  .numlist{list-style:none;margin:0;padding:0;counter-reset:n;border-top:1px solid var(--rule2)}
  .numlist li{position:relative;padding:13px 0 13px 34px;counter-increment:n;border-bottom:1px solid var(--rule2);font-size:.96em}
  .numlist li::before{content:counter(n,decimal-leading-zero);position:absolute;left:0;top:14px;font-size:.74em;font-weight:700;color:var(--ink3);letter-spacing:.06em}
  .numlist .sub{display:block;font-size:.86em;color:var(--ink3);margin-top:3px;line-height:1.6}
  .status{display:inline-block;font-size:.7em;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:2px;margin-right:8px;vertical-align:.08em}
  .status.ok{color:var(--green);background:var(--green-wash)}
  .status.sug{color:var(--blue-ink);background:var(--blue-wash)}
  .status.ask{color:var(--amber);background:var(--amber-wash)}

  .formblock{margin-top:38px;border-top:1px solid var(--rule);padding-top:22px}
  .formblock .flabel{display:block;font-size:.72em;font-weight:700;letter-spacing:.2em;color:var(--ink3);margin-bottom:10px}
  .opt{display:flex;gap:14px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--rule2);cursor:pointer}
  .opt:first-of-type{border-top:1px solid var(--rule2)}
  .opt input{margin:0;width:18px;height:18px;flex:none;accent-color:var(--blue);margin-top:.25em}
  .opt b{display:block;font-weight:600;font-size:.96em}
  .opt span.d{display:block;font-size:.84em;color:var(--ink3);margin-top:2px;line-height:1.6}
  .opt:has(input:checked){box-shadow:inset 2px 0 0 var(--blue);padding-left:12px}
  .opt:has(input:checked) b{color:var(--blue-ink)}
  .field{display:grid;grid-template-columns:9em 1fr;gap:16px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--rule2)}
  @media(max-width:600px){.field{grid-template-columns:1fr;gap:6px}}
  .field label{font-size:.88em;font-weight:600}
  .field .hint{display:block;font-size:.8em;color:var(--ink3);font-weight:400;margin-top:2px}
  .field input{width:100%;padding:12px;font:inherit;font-size:1em;border:1px solid var(--rule3);background:var(--sheet);color:var(--ink);border-radius:2px;min-height:50px}
  .field input:focus{border-color:var(--blue);outline:2px solid var(--blue-wash);outline-offset:0}
  .formcta{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:28px}
  @media(max-width:640px){.formcta{display:grid}.formcta .btn-primary{width:100%}}

  /* ---------- call / scam / help ---------- */
  .script{border-top:1px solid var(--rule);margin-top:32px;padding-top:20px}
  .script .lab{display:block;font-size:.7em;letter-spacing:.22em;color:var(--ink3);margin-bottom:10px}
  .say{font-size:1.02em;line-height:1.85;padding-left:18px;border-left:2px solid var(--blue)}
  .say b{color:var(--blue-ink)}
  .qa{margin:0;border-top:1px solid var(--rule2)}
  .qaitem{display:grid;grid-template-columns:1fr 1.25fr;gap:20px;padding:13px 0;border-bottom:1px solid var(--rule2);font-size:.92em}
  @media(max-width:640px){.qaitem{grid-template-columns:1fr;gap:4px}}
  .qaitem b{font-weight:600}
  .qaitem span{color:var(--ink2)}
  .wline{border-bottom:1px solid var(--rule3);height:2.1em}
  .wlabel{font-size:.8em;color:var(--ink3);margin-top:14px}

  .scamq{padding:16px 0;border-bottom:1px solid var(--rule2)}
  .scamq:first-child{border-top:1px solid var(--rule2)}
  .scamq .q{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:baseline;font-size:.96em;line-height:1.65}
  @media(max-width:640px){.scamq .q{grid-template-columns:auto 1fr}.yn{grid-column:2;justify-self:start;margin-top:4px}}
  .scamq .qn{font-size:.76em;color:var(--ink3);font-variant-numeric:tabular-nums}
  .scamq .text{grid-column:2}
  .yn{display:flex;gap:8px;justify-self:end;align-self:start}
  .yn button{background:var(--sheet);border:1px solid var(--rule3);border-radius:2px;padding:8px 14px;font-size:.86em;color:var(--ink2);cursor:pointer;min-height:44px;min-width:64px}
  .yn button:hover{color:var(--ink)}
  .yn button[aria-pressed="true"]{color:#fff;font-weight:700;background:var(--blue);border-color:var(--blue)}
  .yn button[aria-pressed="true"].bad{color:#fff;background:var(--red);border-color:var(--red)}
  .verdict{margin-top:22px;padding:15px 18px;font-size:.94em;line-height:1.75;border:1px solid var(--rule3);border-left-width:3px}
  .verdict.good{border-color:#bcd0c2;border-left-color:var(--green);background:var(--green-wash);color:#244c37}
  .verdict.bad{border-color:#e0bdb6;border-left-color:var(--red);background:var(--red-wash);color:#6f2318}
  .verdict.tmp{border-left-color:var(--ink3);background:var(--sheet);color:var(--ink2)}

  .helplist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule2)}
  .helplist li{padding:13px 0;border-bottom:1px solid var(--rule2);font-size:.95em;line-height:1.65}

 body{background:var(--paper);color:var(--ink)}.page{max-width:1140px}.masthead{border-color:#ded6ca}.brand .wordmark{color:#973b2c}.brand-sub{color:#4b433d}.ctl[aria-pressed="true"]{color:#7d2e22}.ctl[aria-pressed="true"]::after{background:#973b2c}.ctl:hover{color:#7d2e22;background:#f7ece4}

 .assistant-message{grid-area:message;margin:0 0 14px;display:block}.message-icon{display:none}.message-body{border:0;border-left:4px solid #b55b43;border-radius:0;background:#f5e9db;max-width:none;padding:18px 20px}.message-body h2{color:#332c27}.message-body p,.message-body .capability{color:#4c4038}.message-body .capability{border-color:#decbbb}

</head>
<body>
<div class="page">
  <header class="masthead">
    <button class="brand" onclick="go('home')" aria-label="回到首页">
      <span class="wordmark">明白</span>
      <span class="brand-sub" id="tag">办事助手</span>
    </button>
    <div class="controls">
      <span class="ctl-group" role="group" aria-label="语言 / Language">
        <button class="ctl" id="lzh" aria-pressed="true" onclick="setLang('zh')">中文</button>
        <button class="ctl" id="len" aria-pressed="false" onclick="setLang('en')">EN</button>
      </span>
      <span class="ctl-group" role="group" aria-labelledby="size-label">
        <span class="ctl-label" id="size-label">字号</span>
        <button class="ctl" id="sz0" data-sz="" aria-pressed="true" onclick="setSize('',this)">标准</button>
        <button class="ctl" id="sz1" data-sz="lg" aria-pressed="false" onclick="setSize('lg',this)">大</button>
        <button class="ctl" id="sz2" data-sz="xl" aria-pressed="false" onclick="setSize('xl',this)">特大</button>
      </span>
    </div>
  </header>

  <!-- HOME: guided assistant -->
  <main class="view" id="v-home">
    <div class="resume" id="h-resume" hidden><span class="rt" id="h-resume-t"></span><span class="ra"><button class="btn-primary" onclick="resumeLast()" id="h-resume-go"></button><button class="linkbtn" onclick="dismissResume(this)" id="h-resume-no"></button></span></div>
    <div class="assistant-shell">
      <div class="assistant-welcome"><span class="assistant-avatar" aria-hidden="true">明</span><div class="assistant-intro"><p class="workspace-kicker" id="ws-kicker"></p><h1 id="ws-title"></h1><p id="ws-intro"></p></div></div>
      <div class="assistant-message" aria-labelledby="notice-label"><div class="message-icon" aria-hidden="true">明</div><div class="message-body"><h2 id="notice-label"></h2><p id="notice-help"></p><p class="capability" id="assistant-capability"></p></div></div>
      <div class="assistant-composer"><label for="home-notice" id="home-notice-label"></label><textarea id="home-notice" maxlength="4000" spellcheck="false" autocomplete="off" aria-describedby="notice-help home-error" oninput="clearHomeError()"></textarea><p class="home-error" id="home-error" role="alert" hidden></p><div class="composer-actions"><button class="btn-primary" type="button" id="home-submit" onclick="startHomeNotice()"></button><button class="example-link" type="button" id="home-example" onclick="homeSample()"></button></div><p class="privacy-line" id="home-privacy"></p></div>
      <section class="assistant-alternatives"><div class="alternative-heading"><h2 id="manual-heading"></h2><p id="manual-desc"></p></div><div class="quick-actions"><button type="button" class="quick-action" onclick="startWith('pension')" id="quick-pension"></button><button type="button" class="quick-action" onclick="startWith('medical')" id="quick-medical"></button><button type="button" class="quick-action" onclick="startWith('care')" id="quick-care"></button><button class="quick-action all-topics" id="manual-button" onclick="openLetter()"></button></div></section>
      <aside class="paper-preview" aria-labelledby="preview-title"><div class="preview-top"><span id="preview-label"></span><span class="preview-stamp" aria-hidden="true">明</span></div><h2 id="preview-title"></h2><p id="preview-caption"></p><div class="preview-rows"><div><span id="preview-time-label"></span><strong id="preview-time-value"></strong></div><div><span id="preview-place-label"></span><strong id="preview-place-value"></strong></div><div><span id="preview-bring-label"></span><strong id="preview-bring-value"></strong></div></div><p class="preview-foot" id="preview-foot"></p></aside>

      <details class="assistant-progress"><summary id="side-label"></summary><ol class="side-steps"><li><span>1</span><div><b id="step1-title"></b><p id="step1-desc"></p></div></li><li><span>2</span><div><b id="step2-title"></b><p id="step2-desc"></p></div></li><li><span>3</span><div><b id="step3-title"></b><p id="step3-desc"></p></div></li></ol><p class="side-note" id="side-note"></p></details>
      <section class="workspace-help"><h2 id="help-heading"></h2><div class="help-buttons" id="h-tools"></div><details class="method"><summary id="about-sum"></summary><div id="about-body"></div></details><details class="method" id="design-sources"><summary id="sources-summary"></summary><div id="sources-body"></div></details></section>
    </div>
  </main>

  <!-- LETTER -->
  <main class="view" id="v-letter" hidden>
    <button class="backlink" onclick="go('home')"><span aria-hidden="true">‹</span><span class="back-t"></span></button>
    <div class="pagehead">
      <h1 id="l-title"></h1>
      <p class="lede" id="l-sub"></p>
    </div>
    <p class="note" id="l-note"></p>
    <details class="type-picker" id="type-picker" open>
      <summary id="type-picker-summary"></summary>
      <ul class="toc toc-main" id="l-types" role="group"></ul>
    </details>
    <div class="selected-type" id="selected-type"></div>
    <div id="l-form" hidden>
      <p class="wizard-progress" id="wizard-progress" aria-live="polite"></p>
      <div class="formblock" id="wizard-date">
        <span class="flabel" id="f-date-k"></span>
        <div id="f-dtypes"></div>
        <div class="field" id="f-date-wrap">
          <label for="f-date"><span id="f-date-l"></span><span class="hint" id="f-date-h"></span></label>
          <input id="f-date" type="date">
        </div>
      </div>
      <div class="formblock" id="wizard-known">
        <span class="flabel" id="f-known-k"></span>
        <p class="fineprint" id="f-known-h" style="margin:0 0 8px"></p>
        <div id="f-known"></div>
      </div>
      <div class="formblock" id="wizard-contact">
        <span class="flabel" id="f-place-k"></span>
        <div class="field">
          <label for="f-time" id="f-time-l"></label>
          <div><input id="f-time" type="text" autocomplete="off" placeholder="例如 14:30"><span class="hint" id="f-time-h"></span></div>
        </div>
        <div class="field">
          <label for="f-place" id="f-place-l"></label>
          <div><input id="f-place" type="text" autocomplete="off"><span class="hint" id="f-place-h"></span></div>
        </div>
        <div class="field">
          <label for="f-phone" id="f-phone-l"></label>
          <div><input id="f-phone" type="tel" inputmode="tel" autocomplete="off"><span class="hint" id="f-phone-h"></span></div>
        </div>
      </div>
      <div class="formcta">
        <button class="btn-quiet" type="button" onclick="wizardMove(-1)" id="wizard-back"></button>
        <button class="btn-primary" type="button" onclick="wizardMove(1)" id="wizard-next"></button>
        <button class="btn-primary" onclick="makeTasks()" id="f-go"></button>
        <button class="linkbtn" onclick="skipForm()" id="f-skip"></button>
      </div>
    </div>
    <details class="details-guide" id="guide-section"><summary id="guide-summary"></summary><div id="l-detail"></div></details>
  </main>

  <!-- PASTE -->
  <main class="view" id="v-paste" hidden>
    <button class="backlink" onclick="go('home')"><span aria-hidden="true">‹</span><span class="back-t"></span></button>
    <div class="pagehead">
      <h1 id="p-title"></h1>
      <p class="lede" id="p-sub"></p>
    </div>
    <details class="original-notice" id="p-original" open><summary id="p-original-summary"></summary>
    <div class="pasteform">
      <label class="flab" for="p-text" id="p-lab"></label>
      <textarea id="p-text" spellcheck="false" autocomplete="off" maxlength="4000" oninput="noticeChanged()"></textarea>
      <div class="examples">
        <span id="p-ex"></span>
        <button type="button" onclick="fillSample(0)" id="p-ex1"></button>
        <button type="button" onclick="fillSample(1)" id="p-ex2"></button>
        <button type="button" onclick="fillSample(2)" id="p-ex3"></button>
      </div>
      <div class="pasterow">
        <button class="btn-primary" onclick="runExtract()" id="p-go"></button>
        <button class="linkbtn" onclick="pasteClear()" id="p-clear"></button>
        <button class="linkbtn" onclick="openLetter()" id="p-template"></button>
      </div>
      <p class="fineprint" id="p-fine" style="margin:14px 0 0"></p>
    </div></details>
    <section class="detect" id="p-result" hidden aria-live="polite"></section>
  </main>

  <!-- TASKS -->
  <main class="view" id="v-tasks" hidden>
    <button class="backlink" onclick="go('home')"><span aria-hidden="true">‹</span><span class="back-t"></span></button>
    <div class="task-head">
      <div>
        <p class="task-kind" id="t-kind"></p>
        <h1 class="task-date" id="t-date"></h1>
      </div>
      <div class="task-meta" id="t-meta"></div>
    </div>
    <p class="banner" id="t-banner" hidden></p>
    <p class="note" id="t-note"></p>
    <div class="callrow" id="t-callrow"></div>

    <section class="next" id="t-next" hidden></section>

    <section class="group">
      <div class="group-head"><h2 class="sec-label" id="t-list-h"></h2><span class="count" id="t-count"></span></div>
      <ol class="schedule" id="t-list"></ol>
    </section>

    <section class="group">
      <div class="group-head"><h2 class="sec-label" id="t-bring-h"></h2><span class="count" id="t-bring-count"></span></div>
      <ul class="flatlist" id="t-bring"></ul>
      <p class="fineprint" id="t-bring-hint" style="margin:10px 0 0"></p>
    </section>

    <section class="group" id="t-confirm-wrap">
      <h2 class="sec-label" id="t-confirm-h"></h2>
      <ul class="confirmlist" id="t-confirm"></ul>
    </section>

    <div class="actions">
      <button class="btn-primary" onclick="doPrint()" id="t-print"></button>
      <button class="textbtn" onclick="copyFamily(this)" id="t-copy"></button>
      <button class="textbtn" onclick="readAll(this)" id="t-read"></button>
    </div>
    <div class="more">
      <span class="mlabel" id="t-more"></span>
      <button class="textbtn" onclick="exportICS()" id="t-ics"></button>
      <button class="textbtn" onclick="copyFamilyLink(this)" id="t-link"></button>
      <button class="textbtn" onclick="saveNow(this)" id="t-save"></button>
      <button class="textbtn" onclick="clearSaved()" id="t-clear"></button>
    </div>
    <p class="editline" id="t-edit"></p>
    <div class="voice" id="t-voice"></div>
    <p class="after" id="t-saved" hidden style="margin-top:12px;color:var(--green);font-size:.84em"></p>
  </main>

  <!-- CALL -->
  <main class="view" id="v-call" hidden>
    <button class="backlink" onclick="go('home')"><span aria-hidden="true">‹</span><span class="back-t"></span></button>
    <div class="pagehead"><h1 id="c-title"></h1><p class="lede" id="c-sub"></p></div>
    <div class="script">
      <span class="lab" id="c-open-k"></span>
      <div class="say" id="c-offline"></div>
    </div>
    <div class="script">
      <span class="lab" id="c-ask-k"></span>
      <ul class="numlist" id="c-ask"></ul>
      <div class="voice" id="c-voice"></div>
      <div style="margin-top:14px;display:flex;gap:22px;flex-wrap:wrap"><button class="textbtn" onclick="readCall(this)" id="c-read"></button><button class="textbtn" onclick="printCallPage()" id="c-print"></button></div>
    </div>
    <div class="script">
      <span class="lab" id="c-ans-k"></span>
      <div class="qa" id="c-qa"></div>
    </div>
    <div class="script">
      <span class="lab" id="c-write-k"></span>
      <div id="c-write"></div>
      <p class="fineprint" id="c-write-hint" style="margin-top:10px"></p>
    </div>
  </main>

  <!-- SCAM -->
  <main class="view" id="v-scam" hidden>
    <button class="backlink" onclick="go('home')"><span aria-hidden="true">‹</span><span class="back-t"></span></button>
    <div class="pagehead"><h1 id="s-title"></h1><p class="lede" id="s-sub"></p></div>
    <div id="s-panel" style="margin-top:20px"></div>
    <div id="s-verdict"></div>
    <div style="margin-top:18px"><button class="linkbtn" onclick="resetScam()" id="s-reset"></button></div>
  </main>

  <!-- HELP -->
  <main class="view" id="v-help" hidden>

  about:`<h4>它解决什么问题</h4><p>办事办不成，常常不是看不懂字，而是材料没带全、顺序记不住、被人催着做了错误决定。所以它不解释政策，只给你三样能用的东西：一张排好日期的清单、一段能照着念的电话稿、一张能打印能写字的纸。</p>
<h4>通知是怎么变成清单的</h4><p>你把通知原文贴进来，网页在本机用一组规则把日期、时间、地点、电话、要带的材料挑出来，再按这一类事常见的办理顺序排成清单。整个过程不联网，也没有把文字发给任何服务器。认出来的字段都会显示出来让你核对，认错可以改，没认出可以补。</p>
<h4>为什么每项都标状态</h4><p>规则只认字面，不懂政策。所以每项标：已写明 / 建议准备 / 待确认，提醒你对照原文，别把提示当规定。</p>
<h4>视觉依据</h4><p>按工信部《互联网网站适老化通用设计规范》：不用阴影、透视、纹理；正文 18px 起，可放大到 25px；对比度不低于 4.5:1；点击区域不小于 44px；首页只留一个主按钮和一个示例。</p>
<h4>它不做什么</h4><ul><li>不判断资格，不给用药、医疗或法律建议</li><li>不把通知原文或你填的内容发到网上，也不保存到服务器</li><li>不是联网的 AI：识别靠本机规则，可能漏认或认错，以通知原文为准</li><li>不替你做决定，也不代替窗口和医生</li></ul>
<h4>已知局限</h4><p>能认十类常见通知，冷门写法会认不全；排期顺序是常识，不代表官方流程；语音取决于设备；家属链接需要网页已上线；还没有做真实用户的可用性测试。</p>`

<h4>How the notice becomes a list</h4><p>You paste the notice text. The page pulls out the date, time, place, phone number and papers using a set of rules that run on this device, then orders them the way this kind of errand usually goes. Nothing is sent anywhere. Every field it finds is shown for you to check; correct it or add what is missing.</p>

function resumeMeaningful(){
  return !!(state.scen && SCEN[state.scen] && (state.date || state.place || state.phone || (state.materials||[]).length || Object.keys(state.checks||{}).length || Object.keys(state.bring||{}).length));
}
function renderResume(){
  const el=$("h-resume"); if(!el) return;
  if(!hadLocal || resumeDismissed || !resumeMeaningful()){ el.hidden=true; return; }
  const d=SCEN[state.scen][lang];
  const total=(SCEN[state.scen][lang].tasks||[]).length;
  const done=Object.keys(state.checks||{}).filter(k=>state.checks[k]).length;
  const dt=parseDate(state.date);
  const prog=total ? t("count").replace("{d}",done).replace("{n}",total) : "";
  $("h-resume-t").innerHTML=t("resumeT")
    .replace("{name}",esc(d.name))
    .replace("{d}", dt ? " · "+fmtDate(dt) : "")
    .replace("{p}", prog ? " · "+prog : "");
  $("h-resume-go").textContent=t("resumeGo");
  $("h-resume-no").textContent=t("resumeNo");
  el.hidden=false;
}

function cleanPlace(s){

function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parseDate(s){ if(!s) return null; const d=new Date(s+"T00:00:00"); return isNaN(d)?null:d; }

function schedule(when){
  if(!full() || state.dtype==="unknown") return null;
  if(when==="today") return today0();
  const due=parseDate(state.date); if(!due) return null;
  const map={d3:-3,d2:-2,d1:-1,due:0}; const off=map[when];
  if(off===undefined) return null;

}

}

function isToday(when){ const d=schedule(when); if(!d) return false; const x=new Date(d); x.setHours(0,0,0,0); return x.getTime()===today0().getTime(); }
function isOverdue(when){ const d=schedule(when); if(!d) return false; const t0=today0(); d.setHours(0,0,0,0); return d.getTime()<t0.getTime(); }
function daysUntil(d){ const t0=today0(); const x=new Date(d); x.setHours(0,0,0,0); return Math.round((x-t0)/86400000); }

    else fallback();

}

}

/* ---------------- family link ---------------- */
function b64e(s){ const b=new TextEncoder().encode(s); let bin=""; b.forEach(x=>bin+=String.fromCharCode(x)); return btoa(bin); }
function b64d(x){ const bin=atob(x); const b=Uint8Array.from(bin,c=>c.charCodeAt(0)); return new TextDecoder().decode(b); }
function encodeState(){
  const o={v:3,l:state.scen,dt:state.dtype,d:state.date,p:state.place,t:state.phone,k:state.known};
  if(state.time) o.tm=state.time;
  if((state.materials||[]).length) o.m=state.materials;
  return b64e(JSON.stringify(o));
}
function validState(o){
  if(!o||typeof o!=="object") return false;
  if(!SCEN[o.l]) return false;
  if(["deadline","appoint","followup","unknown"].indexOf(o.dt)<0) return false;
  if(o.d && !/^\d{4}-\d{2}-\d{2}$/.test(o.d)) return false;
  if(typeof o.p==="string" && o.p.length>60) return false;
  if(typeof o.t==="string" && o.t.length>40) return false;
  if(o.tm!==undefined && (typeof o.tm!=="string" || o.tm.length>20)) return false;
  if(o.m!==undefined && (!Array.isArray(o.m) || o.m.length>12 || o.m.some(x=>typeof x!=="string"||x.length>40))) return false;
  return true;
}
function loadFromHash(){
  const m=location.hash.match(/#f=([^&]+)/); if(!m) return false;
  try{
    const o=JSON.parse(b64d(decodeURIComponent(m[1])));
    if(!validState(o)) return false;
    state.scen=o.l; state.dtype=o.dt; state.date=o.d||""; state.place=(o.p||"").slice(0,60); state.phone=(o.t||"").slice(0,40);
    state.time=typeof o.tm==="string"?o.tm.slice(0,20):"";
    state.materials=Array.isArray(o.m)?o.m.map(x=>String(x).slice(0,40)).filter(Boolean).slice(0,12):[];
    state.known=o.k||{}; state.checks={}; state.fromFamily=true;
    try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
    saveLocal(); return true;
  }catch(e){ return false; }
}
function copyFamilyLink(btn){
  if(location.protocol==="file:"){ toast(t("linkFile")); return; }
  if(!confirm(lang==="zh" ? "链接包含清单中的日期、地点、电话和材料，拿到链接的人可以查看。请只分享给信任的人。继续复制吗？" : "This link contains the date, place, phone and materials. Anyone with the link can read them. Share only with someone you trust. Copy it?")) return;
  const url=location.href.split("#")[0]+"#f="+encodeURIComponent(encodeState());
  copyText(url).then(ok=>{ toast(ok?t("linkCopied"):t("copyFail")); if(ok){ const o=btn.textContent; btn.textContent=t("linkCopied"); setTimeout(()=>{btn.textContent=o;},1800); } });
}

/* ---------------- calendar ---------------- */
function pad(n){ return String(n).padStart(2,"0"); }
function ymd(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
function icsText(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function fold(line){ const enc=new TextEncoder(); let out="",buf="",n=0;
  for(const ch of line){ const b=enc.encode(ch).length; if(n+b>70){ out+=buf+"\r\n "; buf=ch; n=b; } else { buf+=ch; n+=b; } }
  return out+buf; }
function exportICS(){
  if(!full()||state.dtype==="unknown"||!state.date){ toast(t("icsNoDate")); return; }
  const d=S(), list=taskList();
  const evs=list.map(x=>({x,dt:schedule(x.when)})).filter(e=>e.dt);
  if(!evs.length){ toast(t("icsNoDate")); return; }
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  const parsedTime=parseNoticeTime(state.time||"");
  const timeMatch=parsedTime.match(/^(\d{2}):(\d{2})$/);
  let out="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Mingbai//v4.0//EN\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n";
  evs.forEach((e,i)=>{ const dt=ymd(e.dt);
    out+="BEGIN:VEVENT\r\n"+fold("UID:mingbai-"+dt+"-"+i+"@mingbai.local")+"\r\nDTSTAMP:"+stamp+"\r\n";
    if(timeMatch && e.x.when==="due" && (state.dtype==="appoint"||state.dtype==="followup")){
      const start=new Date(e.dt); start.setHours(+timeMatch[1],+timeMatch[2],0,0);
      const end=new Date(start.getTime()+30*60000);
      out+="DTSTART:"+ymd(start)+"T"+pad(start.getHours())+pad(start.getMinutes())+"00\r\nDTEND:"+ymd(end)+"T"+pad(end.getHours())+pad(end.getMinutes())+"00\r\n";
    } else { out+="DTSTART;VALUE=DATE:"+dt+"\r\nDTEND;VALUE=DATE:"+ymd(offsetDate(e.dt,1))+"\r\n"; }
    out+=fold("SUMMARY:"+icsText(e.x.t))+"\r\n"+fold("DESCRIPTION:"+icsText(d.name+" · "+e.x.hint))+"\r\n";
    if(state.place) out+=fold("LOCATION:"+icsText(state.place))+"\r\n";
    out+="BEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\n"+fold("DESCRIPTION:"+icsText(d.name))+"\r\nEND:VALARM\r\nEND:VEVENT\r\n";
  });
  out+="END:VCALENDAR\r\n";
  const blob=new Blob([out],{type:"text/calendar;charset=utf-8"}), url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="mingbai-tasks.ics"; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},600); toast(t("icsDone"));
}

/* ---------------- speech ---------------- */
let voices=[], speaking=false;
function loadVoices(){ if(!("speechSynthesis" in window)) return; voices=window.speechSynthesis.getVoices()||[]; renderVoice(); }
if("speechSynthesis" in window){ loadVoices(); window.speechSynthesis.onvoiceschanged=loadVoices; }
function bestVoice(){ if(state.voice){ const f=voices.find(v=>v.name===state.voice); if(f) return f; }
  const want=lang==="zh"?["zh-CN","zh-HK","zh"]:["en-US","en-GB","en"];
  for(const w of want){ const f=voices.find(v=>(v.lang||"").toLowerCase().startsWith(w.toLowerCase())); if(f) return f; }
  return voices[0]||null; }
function renderVoice(){
  const want = lang==="zh" ? /^(zh|yue)/i : /^en/i;
  let list=voices.filter(v=>want.test(v.lang||""));
  if(!list.length) list=voices;
  const opts=list.map(v=>`<option value="${v.name.replace(/"/g,"&quot;")}"${state.voice===v.name?" selected":""}>${v.name}${v.lang?" · "+v.lang:""}</option>`).join("");
  document.querySelectorAll(".voice").forEach(bar=>{
    bar.innerHTML=`<span>${t("vTitle")}</span>
      <label>${t("vVoice")} <select class="vsel">${opts||"<option>"+t("noVoice")+"</option>"}</select></label>
      <label>${t("vRate")} <select class="rsel"><option value="0.8"${state.rate===0.8?" selected":""}>${t("slow")}</option><option value="0.92"${state.rate===0.92?" selected":""}>${t("normal")}</option><option value="1.05"${state.rate===1.05?" selected":""}>${t("fast")}</option></select></label>`;
    const vs=bar.querySelector(".vsel"), rs=bar.querySelector(".rsel");
    if(vs) vs.onchange=()=>{state.voice=vs.value;};
    if(rs) rs.onchange=()=>{state.rate=parseFloat(rs.value);};
  });
}
function speak(text,btn,labelKey){
  const back=labelKey||"read";
  if(!("speechSynthesis" in window)){ toast(t("noVoice")); return; }
  if(speaking){ window.speechSynthesis.cancel(); speaking=false; if(btn) btn.textContent=t(back); return; }
  const u=new SpeechSynthesisUtterance(text), v=bestVoice();
  if(v) u.voice=v; u.lang=v?v.lang:(lang==="zh"?"zh-CN":"en-US"); u.rate=state.rate||0.92;
  u.onend=()=>{ speaking=false; if(btn) btn.textContent=t(back); };
  window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); speaking=true; if(btn) btn.textContent=t("readStop");
}
function readAll(btn){
  const d=S(), list=taskList();
  const stop=lang==="zh"?"。":". ", sepc=lang==="zh"?"，":", ", sep=lang==="zh"?"、":", ";
  const parts=[d.name];
  const dt=parseDate(state.date);
  if(dt) parts.push(fmtDate(dt)+(state.time?" "+state.time:""));
  if(state.place) parts.push(t("placeL")+sepc+state.place);
  if(state.phone) parts.push(t("phoneL")+sepc+state.phone);
  const bl=bringList();
  if(bl.length) parts.push(t("bringTitle")+sepc+bl.map(x=>x.t).join(sep));
  list.forEach((x,i)=>parts.push((i+1)+sep+x.t+stop+x.hint));
  speak(parts.join(stop)+stop,btn,"read");
}
function readCall(btn){
  const d=S();
  const offline=$("c-offline").textContent||"";
  const qs=[...$("c-ask").querySelectorAll("li")].map(li=>li.textContent).join(lang==="zh"?"。":". ");
  const ans=[...$("c-qa").querySelectorAll(".qaitem")].map(x=>x.textContent).join(lang==="zh"?"。":". ");
  const stop=lang==="zh"?"。":". ";
  speak(d.name+stop+offline+stop+qs+stop+ans,btn,"cRead");
}

/* ---------------- call ---------------- */
function openCall(){ renderCall(); go("call"); }
function renderCall(){
  const d=S();
  const dt=parseDate(state.date);
  const when=dt?fmtDate(dt)+(state.time?" "+state.time:""):"";
  $("c-offline").innerHTML = lang==="zh"
    ? `您好，我想咨询<b>${d.name}</b>的事。我收到一份通知，想确认要带什么材料、去哪里办。${when?"时间是 <b>"+esc(when)+"</b>。":""}${state.place?"地点是 <b>"+esc(state.place)+"</b>。":""}`
    : `Hello, I would like to ask about <b>${d.name}</b>. I received a notice and want to confirm what to bring and where to go.${when?" The date is <b>"+esc(when)+"</b>.":""}${state.place?" Place: <b>"+esc(state.place)+"</b>.":""}`;
  $("c-ask").innerHTML=Q.map(q=>`<li>${q[lang]}</li>`).join("");
  $("c-qa").innerHTML=CALLANS.map(a=>`<div class="qaitem"><b>${a[lang][0]}</b><span>${a[lang][1]}</span></div>`).join("");
  $("c-write").innerHTML=WRITE.map(w=>`<div class="wlabel">${w[lang]}</div><div class="wline"></div>`).join("");
  $("c-write-hint").textContent=t("cWriteHint");
}

/* ---------------- scam ---------------- */
function openScam(){ renderScam(); go("scam"); }
function renderScam(){
  $("s-panel").innerHTML=SCAMQ.map((q,i)=>`
    <div class="scamq"><div class="q"><span class="qn">${pad(i+1)}</span><span class="text">${q[lang]}</span>
      <span class="yn">
        <button class="${state.scam[i]===true?"bad":""}" aria-pressed="${state.scam[i]===true}" onclick="answerScam(${i},true,this)">${t("yes")}</button>
        <button aria-pressed="${state.scam[i]===false}" onclick="answerScam(${i},false,this)">${t("no")}</button>
      </span></div></div>`).join("");
  renderVerdict();
}
function answerScam(i,v,btn){
  state.scam[i]=v;
  btn.parentElement.querySelectorAll("button").forEach(b=>{ b.setAttribute("aria-pressed","false"); b.classList.remove("bad"); });
  btn.setAttribute("aria-pressed","true"); if(v) btn.classList.add("bad");
  renderVerdict();
}
function renderVerdict(){
  const answered=Object.keys(state.scam).length;
  const anyYes=Object.values(state.scam).some(v=>v===true);
  if(anyYes){ $("s-verdict").innerHTML=`<div class="verdict bad">${t("sBad")}</div>`; return; }
  if(answered===0){ $("s-verdict").innerHTML=""; return; }
  if(answered<SCAMQ.length){ $("s-verdict").innerHTML=`<div class="verdict tmp">${t("sTmp").replace("{n}",answered)}</div>`; return; }
  $("s-verdict").innerHTML=`<div class="verdict good">${t("sGood")}</div>`;
}
function resetScam(){ state.scam={}; renderScam(); }

/* ---------------- help ---------------- */
function openHelp(){ renderHelp(); go("help"); }
function renderHelp(){ $("hp-list").innerHTML=HELP[lang].list.map(x=>`<li>${x}</li>`).join(""); $("hp-who").innerHTML=HELP[lang].who.map(x=>`<li>${x}</li>`).join(""); }

/* ---------------- storage ---------------- */
const KEY="mingbai.v3"; // keep the old key: existing users' data must keep loading
function cleanMats(a){
  if(!Array.isArray(a)) return [];
  return a.filter(x=>typeof x==="string" && x.trim()).map(x=>x.trim().slice(0,40)).slice(0,12);
}
function saveLocal(){
  if(state.demo) return;
  try{
    localStorage.setItem(KEY,JSON.stringify({
      scen:state.scen, dtype:state.dtype, date:state.date, time:state.time,
      place:state.place, phone:state.phone, known:state.known, checks:state.checks,
      materials:state.materials, bring:state.bring
    }));
    hadLocal=true;
  }catch(e){}
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return false;
    const o=JSON.parse(raw); if(!o||!SCEN[o.scen]) return false;
    state.scen=o.scen;
    state.dtype=["deadline","appoint","followup","unknown"].indexOf(o.dtype)>=0?o.dtype:"unknown";
    state.date=(typeof o.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(o.date))?o.date:"";
    state.time=typeof o.time==="string"?o.time.slice(0,20):"";
    state.place=typeof o.place==="string"?o.place.slice(0,60):"";
    state.phone=typeof o.phone==="string"?o.phone.slice(0,40):"";
    state.materials=cleanMats(o.materials);
    state.known=(o.known&&typeof o.known==="object")?o.known:{};
    state.checks=(o.checks&&typeof o.checks==="object")?o.checks:{};
    state.bring=(o.bring&&typeof o.bring==="object")?o.bring:{};
    return true;
  }catch(e){ return false; }
}
function saveNow(){ saveLocal(); const st=$("t-saved"); st.hidden=false; st.textContent=t("saved"); setTimeout(()=>{st.hidden=true;},2600); toast(t("saveToast")); }
function clearSaved(){
  if(!confirm(lang==="zh"?"确定删除这台设备上保存的清单吗？":"Delete the checklist saved on this device?")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  state=freshState(); hadLocal=false;
  toast(t("clearToast")); go("home"); paint();
}

/* ---------------- demo ---------------- */
function loadDemo(){
  state.scen="care"; state.dtype="appoint"; state.date="2026-11-20";
  state.time=lang==="zh"?"上午 9:30":"9:30 am";
  state.place=lang==="zh"?"社区服务中心 2 楼":"Community service centre, 2F";
  state.phone="12333"; state.known={time:true,docs:true,what:true}; state.checks={}; state.bring={}; state.materials=[];
  state.demo=true; state.fromFamily=false;
  renderTasks(); go("tasks");
  setBanner("demo");
}

/* ---------------- init ---------------- */
window.addEventListener("beforeprint", () => { try{ if(!$("v-tasks").hidden) buildPrintSheet(); }catch(e){} });
const fromFamily=loadFromHash();
if(!fromFamily) hadLocal=loadLocal();
setLang(lang);
if(fromFamily){
  renderTasks(); go("tasks");
  setBanner("family");
} else go("home");

</script>
