<html lang="zh-CN">
<head>

<meta name="theme-color" content="#1e4b3d"><title>明白 · 办事助手</title>
<style>
:root{font:20px/1.75 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#1a1a1a;background:#fbf9f4}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button,a,input,textarea,summary{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid #1e4b3d;outline-offset:3px}h1:focus,h2:focus{outline:none}[hidden]{display:none!important}h1,h2,h3,p{margin:0}h1{font-size:32px;line-height:1.35}h2{font-size:24px;line-height:1.4}h3{font-size:20px;line-height:1.5}button{min-height:48px}a{color:#1e4b3d}.wrap{width:min(100% - 32px,920px);margin:auto}header.top{min-height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dcd6c9;gap:8px}.brand{font-size:24px;font-weight:700;text-decoration:none}.back,.textbtn{border:0;background:none;color:#1e4b3d;text-decoration:underline;font-weight:700;padding:8px}.page{padding:20px 0 48px}.intro p,.hint{color:#4a4a4a}.intro p{margin-top:4px}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;margin-top:14px}.group h2{font-size:20px;margin-bottom:6px}.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.topic{min-width:0;min-height:56px;background:white;border:2px solid #8c8578;border-radius:12px;padding:8px 10px;text-align:left;font-weight:700;line-height:1.35;overflow-wrap:anywhere}.topic:hover{border-color:#1e4b3d}.example{display:inline-flex;align-items:center;min-height:48px;margin-top:14px;font-weight:700}.trust{border-top:1px solid #dcd6c9;margin-top:16px;padding-top:12px;color:#4a4a4a;font-size:17px}.selected{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;padding:10px 14px;background:#bfd3c6;border:2px solid #1e4b3d;border-radius:12px;font-weight:700}.form-intro{margin:18px 0}.form-intro p{color:#4a4a4a}.section{padding:22px 0;border-top:1px solid #dcd6c9}.section h2{margin-bottom:10px}.date-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.option{background:white;border:2px solid #8c8578;border-radius:12px;padding:8px;font-weight:700}.option[aria-pressed=true]{border-color:#1e4b3d;background:#bfd3c6}.option[aria-pressed=true]::after{content:' ✓ 已选';font-size:17px}.field{min-width:0;margin-top:14px}.field label{display:block;font-weight:700}input[type=text],input[type=tel],input[type=date],input[type=time],textarea{width:100%;min-height:52px;border:2px solid #8c8578;border-radius:12px;padding:8px 12px;background:white}textarea{min-height:110px;resize:vertical}.fields,.materials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}.materials label{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border:2px solid #8c8578;border-radius:12px;background:white}.materials label:has(input:checked){background:#bfd3c6;border-color:#1e4b3d}.materials input{width:24px;height:24px;flex:none;accent-color:#1e4b3d}.hint{font-size:17px;margin:8px 0}.error{color:#9b2c1f;font-weight:700}.primary,.secondary{min-height:56px;padding:10px 20px;border:2px solid #1e4b3d;border-radius:12px;font-weight:700;line-height:1.4}.primary{background:#1e4b3d;color:white}.secondary{background:white;color:#1e4b3d}.paper-wrap,.result-actions{max-width:740px;margin:auto}.paper{background:white;color:#000;border:2px solid #8c8578;padding:24px 30px;box-shadow:0 4px 14px #00000014;overflow-wrap:anywhere}.paper h2{font-size:24px}.paperhead,.papersection,.paperfoot{border-bottom:2px solid #000;padding:8px 0}.paper-meta{font-size:17px}.contact{font-size:24px;line-height:1.5;font-weight:700}.paper ul{list-style:none;margin:0;padding:0}.paper li{display:flex;gap:10px;break-inside:avoid}.box{width:22px;height:22px;border:2px solid #000;flex:none;margin-top:7px}.paperfoot{border:0;font-size:17px}.result-title{margin-bottom:12px}.result-actions{margin-top:16px}.result-actions>.primary{width:100%}.ways{margin-top:14px;border:2px solid #8c8578;border-radius:12px;background:white}.ways summary{min-height:56px;padding:8px 16px;color:#1e4b3d;font-weight:700;cursor:pointer}.ways-content{display:grid;gap:12px;padding:0 16px 16px}.ways-content button{width:100%;text-align:left}.ways-content p{font-size:17px;color:#4a4a4a}.preview img{display:block;max-width:100%;height:auto}.preview a{display:inline-flex;align-items:center;min-height:48px}.large{position:fixed;inset:0;z-index:10;background:white;color:black;overflow:auto;padding:16px}.large-inner{max-width:1000px;margin:auto}.large button{border:2px solid black;border-radius:12px;background:white;padding:8px 18px;font-weight:700}.large h2,.large p{font-size:32px;line-height:1.35;padding:8px 0;border-bottom:2px solid black;overflow-wrap:anywhere}.print-root{display:none}@media(max-width:700px){.groups{grid-template-columns:1fr;gap:12px}.date-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.fields,.materials{grid-template-columns:1fr}.paper{padding:16px}.contact{font-size:20px}.primary{width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media print{@page{size:A4;margin:15mm 18mm}body{background:white;font:12pt/1.5 "Microsoft YaHei",sans-serif}.wrap,.large{display:none!important}.print-root{display:block}.paper{border:0;box-shadow:none;padding:0;font:12pt/1.5 "Microsoft YaHei",sans-serif}.paper h2{font-size:20pt}.paper-meta,.paperfoot{font-size:10pt}.paperhead,.papersection{padding:4pt 0;border-color:#000}.contact{font-size:14pt;line-height:1.35}.box{width:5mm;height:5mm;margin-top:2pt;border:1.5pt solid black}.paper li{break-inside:avoid;page-break-inside:avoid}}
</style></head>
<body><div class="wrap" id="app"><header class="top"><a href="#" class="brand" id="brand">明白</a><button class="back" id="back" hidden>← 返回</button></header>
<main id="home" class="page"><div class="intro"><h1 tabindex="-1">把通知，<br>写成一张纸。</h1><p>选一件事，写下知道的，带着纸去办。</p></div><div class="groups" id="groups"></div><a href="#example" class="example" id="example">看看一张纸长什么样 →</a><footer class="trust">无需注册 · 不联网 · 只在本机处理</footer></main>
<main id="form-page" class="page" hidden><div class="selected"><span id="selected"></span><button class="textbtn" type="button" id="change">改一改</button></div><div class="form-intro"><h1 tabindex="-1">写下知道的事</h1><p>不知道的可以跳过。</p></div><form id="form" novalidate><section class="section"><h2>1. 什么时候去？</h2><div class="date-grid" role="group" aria-label="选择日期"><button type="button" class="option" data-date="today" aria-pressed="false">今天</button><button type="button" class="option" data-date="tomorrow" aria-pressed="false">明天</button><button type="button" class="option" data-date="wednesday" aria-pressed="false">下周三</button><button type="button" class="option" data-date="other" aria-pressed="false">其他</button></div><div class="field" id="date-field" hidden><label for="date">选择日期</label><input id="date" type="date"></div><div class="field"><label for="time">时间（可跳过）</label><input id="time" type="time"></div></section><section class="section"><h2>2. 去哪里，找谁？</h2><div class="fields"><div class="field"><label for="place">地点或联系人</label><input id="place" type="text" maxlength="40" autocomplete="off"></div><div class="field"><label for="phone">联系电话</label><input id="phone" type="tel" maxlength="25" autocomplete="off"></div></div></section><section class="section"><h2>3. 要带什么？</h2><p class="hint">常见材料，办之前先确认。</p><div class="materials" id="materials"></div><div class="field"><label for="extra">还有别的</label><textarea id="extra" maxlength="120" placeholder="一行写一项"></textarea></div><p class="hint">最多写 6 项。</p><p id="form-error" class="error" role="alert"></p></section><button class="primary" type="submit">生成我的办事纸</button></form></main>
<main id="result" class="page" hidden><h1 class="result-title" tabindex="-1" id="result-title">我的办事纸</h1><div class="paper-wrap" id="paper"></div><div class="result-actions"><button class="primary" id="print" type="button">打印这张纸</button><details class="ways" id="ways"><summary>其他方式</summary><div class="ways-content"><div><button class="secondary" id="large-open" type="button">用手机大字卡</button><p>没有打印机也能用。</p></div><div><button class="secondary" id="image" type="button">保存这张图片</button><p>保存不了时可以截图。</p></div><div><button class="secondary" id="share" type="button">给家人看</button><p>链接里有填写的信息。</p></div><div><button class="secondary" id="read" type="button" aria-pressed="false">读给我听</button><p>朗读使用设备语音服务。</p></div><button class="secondary" id="edit" type="button">修改这张纸</button><p id="status" role="status"></p><div id="share-box" hidden><label for="share-text">复制后发给家人</label><textarea id="share-text" readonly></textarea><button class="secondary" id="copy" type="button">复制这段话</button><p id="copy-status" role="status"></p></div><div id="preview" class="preview" hidden><p>长按图片保存，或截图。</p><img id="preview-image" alt="生成的办事纸图片"><a id="download" download="明白办事纸.png">下载图片</a></div></div></details></div></main></div>
<section class="large" id="large" aria-label="手机大字卡" hidden><div class="large-inner"><button id="large-back" type="button">返回</button><div id="large-content"></div></div></section><div class="print-root" id="print-root"></div>
<script>
const names={discharge:'出院后',medical:'医保报销',pension:'养老金资格认证',care:'照护评估',meds:'用药调整',referral:'社区照护转介',aid:'低保 / 困难救助',disability:'残疾证 / 残联',card:'社保卡 / 医保卡',service:'助餐助浴 / 适老化改造',pensionPayment:'养老金到账或金额',other:'其他事项'};
const topics={discharge:{suggest:['出院小结','身份证','用药清单'],steps:['向医生或护士确认回家后的安排。','问清是否需要复诊、何时复诊。','不清楚的用药问题，请问医生或药师。'],say:'您好，我想问一下出院后需要注意什么、什么时候复诊？'},medical:{suggest:['身份证','医保卡','费用发票','费用清单','出院记录'],steps:['先问清办理地点、时间和所需材料。','按经办机构要求准备材料。','提交后询问办理结果如何查询。'],say:'您好，我想问医保报销在哪里办理，需要带什么材料？'},pension:{suggest:['身份证','社保卡','认证通知'],steps:['先问清是否需要认证及截止时间。','确认可以通过什么方式办理。','办理后询问如何确认结果。'],say:'您好，我想问养老金资格认证怎么做，什么时候之前要办？'}};
Object.assign(topics,{care:{suggest:['身份证','病历','用药清单'],steps:['确认评估的时间和地点。','询问需要带的材料。','把需要帮助的日常事情告诉评估人员。'],say:'您好，我想问照护评估在哪里做，需要带什么？'},meds:{suggest:['现在的药盒','新旧药单','病历'],steps:['准备正在使用的药盒或药单。','向医生或药师确认药物和用法。','不清楚时先问医生或药师，不自行调整。'],say:'您好，我想请医生或药师帮我确认药物的用法。'},referral:{suggest:['身份证','评估结果','医保卡'],steps:['确认提供服务的机构和联系人。','询问需要带的材料和服务安排。','说清楚自己希望得到哪些帮助。'],say:'您好，我想问社区照护服务怎么联系，需要准备什么？'},aid:{suggest:['身份证','户口本','收入证明'],steps:['确认要申请或复核的事项。','向社区询问所需材料和办理方式。','提交后询问如何查询结果。'],say:'您好，我想问困难救助怎么办理，需要带什么？'},disability:{suggest:['身份证','残疾证','诊断证明'],steps:['确认要办的是评定、换证还是服务。','询问材料、地点和办理时间。','办理后询问如何查询结果。'],say:'您好，我想问残疾证或相关服务怎么办理？'},card:{suggest:['身份证','旧社保卡','通知原件'],steps:['确认要办的是领卡、换卡、激活还是挂失。','向服务窗口询问需要的材料。','办理后问清下一步和查询方式。'],say:'您好，我想问社保卡的业务在哪里办，需要带什么？'},service:{suggest:['身份证','评估结果','通知原件'],steps:['确认服务机构、联系人和服务项目。','询问服务时间、费用和所需材料。','说清楚自己需要哪些帮助。'],say:'您好，我想问助餐、助浴或居家改造服务怎么申请？'}});
Object.assign(topics,{pensionPayment:{suggest:['身份证','社保卡','通知原件','到账记录'],steps:['核对通知内容和到账记录，不确定的地方记下来。','向社保经办机构确认金额、到账时间和办理方式。','记下答复，并问清下一步如何查询。'],say:'您好，我想问养老金的金额或到账时间发生了变化，该怎么查询？'},other:{suggest:['通知原件','身份证'],steps:['先确认这件事由哪个机构办理。','问清时间、地点和需要准备的材料。','记下答复，并确认下一步怎么做。'],say:'您好，我想咨询一件事，请问需要准备什么、在哪里办理？'}});

const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let topic='',date='',paper=null,example=false,imageURL='',speech=null;const ids=['home','form-page','result'];
const groups=[['看病与用药',['discharge','medical','meds']],['养老金与证件',['pension','pensionPayment','card']],['照护与社区',['care','referral','service']],['生活保障与其他',['aid','disability','other']]];
$('groups').innerHTML=groups.map(([name,items])=>`<section class="group"><h2>${name}</h2><div class="topics">${items.map(k=>`<button class="topic" type="button" data-topic="${k}">${esc(names[k])}</button>`).join('')}</div></section>`).join('');
function stop(){if(speech&&window.speechSynthesis)window.speechSynthesis.cancel();speech=null;$('read').textContent='读给我听';$('read').setAttribute('aria-pressed','false')}
function show(id){stop();ids.forEach(k=>$(k).hidden=k!==id);$('app').hidden=false;$('large').hidden=true;$('back').hidden=id==='home';window.scrollTo(0,0);let h=$(id).querySelector('h1');if(h)h.focus({preventScroll:true})}
function local(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function parse(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return null;let [y,m,d]=s.split('-').map(Number),v=new Date(y,m-1,d);return v.getFullYear()===y&&v.getMonth()===m-1&&v.getDate()===d?v:null}
function dateText(s){let d=parse(s);return d?`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`:'日期待确认'}
function remaining(s){let d=parse(s);if(!d)return '剩余天数待确认';let now=new Date();now.setHours(0,0,0,0);let n=Math.round((d-now)/86400000);return n===0?'就是今天':n>0?`还有 ${n} 天`:'日期已过，办理前确认'}
function when(p){return dateText(p.date)+(p.time?' '+p.time:'')}
function materialOptions(k,items=[]){$('materials').innerHTML=topics[k].suggest.map((v,i)=>`<label><input type="checkbox" value="${esc(v)}" ${items.includes(v)?'checked':''}><span>${esc(v)}</span></label>`).join('')}
function choose(k){if(!Object.hasOwn(topics,k))return;if(topic!==k){$('form').reset();date='';$('date-field').hidden=true;document.querySelectorAll('.option').forEach(b=>b.setAttribute('aria-pressed','false'));materialOptions(k)}topic=k;example=false;$('selected').textContent='你选的是：'+names[k];$('form-error').textContent='';show('form-page')}
function make(p){let mats=p.materials.length?p.materials:['材料待确认'];return `<article class="paper"><header class="paperhead"><h2>${esc(names[p.topic])}</h2><p>${esc(dateText(p.date))} · ${esc(remaining(p.date))}</p></header><section class="papersection paper-meta"><p>发布单位：待确认</p><p>发布日期：待确认　有效期至：待确认</p></section><section class="papersection"><h3>时间、地点、电话</h3><div class="contact"><p>时间：${esc(when(p))}</p><p>地点：${esc(p.place||'待确认')}</p><p>电话：${esc(p.phone||'待确认')}</p></div></section><section class="papersection"><h3>要带什么</h3><ul>${mats.map(x=>`<li><span class="box" aria-hidden="true"></span><span>${esc(x)}</span></li>`).join('')}</ul></section><section class="papersection"><h3>要做什么</h3><ul>${topics[p.topic].steps.slice(0,5).map(x=>`<li><span class="box" aria-hidden="true"></span><span>${esc(x)}</span></li>`).join('')}</ul></section><section class="papersection"><p><b>可以这样问：</b>${esc(topics[p.topic].say)}</p></section><p class="paperfoot">办理前先打上面的电话确认 · 以经办机构为准 · 明白</p></article>`}
function big(p){return `<h2 tabindex="-1">${esc(names[p.topic])}</h2><p><b>时间：</b>${esc(when(p))}</p><p><b>地点：</b>${esc(p.place||'待确认')}</p><p><b>电话：</b>${esc(p.phone||'待确认')}</p><p><b>要带：</b>${esc(p.materials.join('、')||'待确认')}</p><p><b>这样问：</b>${esc(topics[p.topic].say)}</p>`}
function render(){if(imageURL)URL.revokeObjectURL(imageURL);imageURL='';$('paper').innerHTML=make(paper);$('print-root').innerHTML=make(paper);$('large-content').innerHTML=big(paper);$('result-title').textContent=example?'这是一张示例纸':'我的办事纸';$('share-box').hidden=true;$('preview').hidden=true;$('status').textContent='';$('ways').open=false}
function edit(){if(!paper)return;topic=paper.topic;date=paper.date;example=false;$('selected').textContent='你选的是：'+names[topic];$('date').value=date;$('date-field').hidden=!date;$('time').value=paper.time;$('place').value=paper.place;$('phone').value=paper.phone;document.querySelectorAll('.option').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.date==='other'&&!!date)));materialOptions(topic,paper.materials);$('extra').value=paper.materials.filter(x=>!topics[topic].suggest.includes(x)).join('\n');show('form-page')}
function encode(p){let b=new TextEncoder().encode(JSON.stringify(p)),s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),x=>x.charCodeAt(0))))}
function safe(p){if(!p||p.v!==1||!Object.hasOwn(topics,p.topic)||!Array.isArray(p.materials)||p.materials.length>6)return null;return {v:1,topic:p.topic,date:parse(p.date)?p.date:'',time:typeof p.time==='string'?p.time.slice(0,5):'',place:typeof p.place==='string'?p.place.slice(0,40):'',phone:typeof p.phone==='string'?p.phone.slice(0,25):'',materials:p.materials.filter(x=>typeof x==='string').map(x=>x.slice(0,18))}}
function openLarge(){$('app').hidden=true;$('large').hidden=false;$('large-content').innerHTML=big(paper);window.scrollTo(0,0);$('large-content').querySelector('h2').focus({preventScroll:true})}
document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>choose(b.dataset.topic));document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{document.querySelectorAll('.option').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));let d=new Date();d.setHours(0,0,0,0);let v=b.dataset.date;$('date-field').hidden=v!=='other';if(v==='other'){date=$('date').value;$('date').focus();return}if(v==='tomorrow')d.setDate(d.getDate()+1);if(v==='wednesday')d.setDate(d.getDate()-(d.getDay()+6)%7+9);date=local(d);$('date').value=date});$('date').oninput=()=>date=$('date').value;
$('form').onsubmit=e=>{e.preventDefault();let selected=[...document.querySelectorAll('#materials input:checked')].map(x=>x.value),extras=$('extra').value.split(/[\n，,、；;]/).map(x=>x.trim()).filter(Boolean),items=[...new Set([...selected,...extras])];if(items.length>6||items.some(x=>x.length>18)){$('form-error').textContent=items.length>6?'最多写 6 项材料。':'每项材料不超过 18 字。';$('extra').focus();return}paper={v:1,topic,date,time:$('time').value,place:$('place').value.trim(),phone:$('phone').value.trim(),materials:items};example=false;render();show('result')};
$('brand').onclick=e=>{e.preventDefault();show('home')};$('back').onclick=()=>{if(!$('form-page').hidden)show('home');else if(example)show('home');else show('form-page')};$('change').onclick=()=>show('home');$('edit').onclick=edit;
$('example').onclick=e=>{e.preventDefault();let d=new Date();d.setDate(d.getDate()+7);paper={v:1,topic:'medical',date:local(d),time:'09:00',place:'社区服务中心',phone:'',materials:['身份证','医保卡','费用发票']};example=true;render();show('result')};
$('print').onclick=()=>{if(typeof window.print!=='function'){$('ways').open=true;$('status').textContent='这台设备不能直接打印。';return}$('print-root').innerHTML=make(paper);window.print()};$('large-open').onclick=openLarge;$('large-back').onclick=()=>show('result');
$('share').onclick=()=>{let base=location.href.split('#')[0],link=base+'#n='+encode(paper);$('share-text').value=`【明白办事纸】${names[paper.topic]}\n时间：${when(paper)}\n地点：${paper.place||'待确认'}\n电话：${paper.phone||'待确认'}\n要带：${paper.materials.join('、')||'待确认'}\n可以这样问：${topics[paper.topic].say}\n大字卡：${link}`;$('share-box').hidden=false;$('share-text').focus();$('share-text').select();if(location.protocol==='file:')$('copy-status').textContent='本地链接只在此设备可用。'};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('share-text').value);$('copy-status').textContent='已复制，可以发给家人。'}catch(e){$('share-text').focus();$('share-text').select();$('copy-status').textContent='长按选中文字，再点复制。'}};
$('read').onclick=()=>{if(speech){stop();return}if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){$('status').textContent='这台设备暂不支持朗读。';return}try{let u=new SpeechSynthesisUtterance([names[paper.topic],'时间：'+when(paper),'地点：'+(paper.place||'待确认'),'电话：'+(paper.phone||'待确认'),'要带：'+(paper.materials.join('、')||'待确认'),...topics[paper.topic].steps,'可以这样问：'+topics[paper.topic].say].join('。'));u.lang='zh-CN';u.rate=.9;speech=u;$('read').textContent='停止朗读';$('read').setAttribute('aria-pressed','true');u.onend=()=>{if(speech===u)stop()};u.onerror=()=>{if(speech===u){stop();$('status').textContent='朗读暂时用不了。'}};speechSynthesis.speak(u)}catch(e){stop();$('status').textContent='朗读暂时用不了。'}};
$('image').onclick=()=>{let c=document.createElement('canvas');c.width=1400;let ctx=c.getContext('2d');if(!ctx){$('status').textContent='图片生成不了，可以截图。';return}ctx.font='42px Microsoft YaHei, sans-serif';let raw=[names[paper.topic],dateText(paper.date)+' · '+remaining(paper.date),'发布单位：待确认','发布日期：待确认　有效期至：待确认','时间：'+when(paper),'地点：'+(paper.place||'待确认'),'电话：'+(paper.phone||'待确认'),'要带什么',...(paper.materials.length?paper.materials:['材料待确认']).map(x=>'□ '+x),'要做什么',...topics[paper.topic].steps.map(x=>'□ '+x),'可以这样问：'+topics[paper.topic].say,'办理前先打上面的电话确认 · 以经办机构为准 · 明白'],lines=[];for(let text of raw){let row='';for(let ch of text){if(row&&ctx.measureText(row+ch).width>1260){lines.push(row);row=''}row+=ch}lines.push(row)}c.height=Math.max(1200,100+lines.length*68);ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='black';ctx.font='42px Microsoft YaHei, sans-serif';lines.forEach((line,i)=>ctx.fillText(line,70,85+i*68));c.toBlob(blob=>{if(!blob){$('status').textContent='图片生成不了，可以截图。';return}if(imageURL)URL.revokeObjectURL(imageURL);imageURL=URL.createObjectURL(blob);$('preview-image').src=imageURL;$('download').href=imageURL;$('preview').hidden=false;$('status').textContent='图片已生成。';$('preview').scrollIntoView({block:'start'})},'image/png')};
if(location.hash.startsWith('#n=')){try{paper=safe(decode(location.hash.slice(3)));if(paper){topic=paper.topic;render();show('result');openLarge()}}catch(e){$('status').textContent='链接无法读取。'}}else{let wanted=new URLSearchParams(location.search).get('topic');if(Object.hasOwn(topics,wanted))choose(wanted)}
</script></body></html>
