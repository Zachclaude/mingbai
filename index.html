<style>

:18px 0}.form-intro p{color:#4a4a4a}.section{padding:22px 0;border-top:1px solid #dcd6c9}.section h2{margin-bottom:10px}.date-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.option{background:white;border:2px solid #8c8578;border-radius:12px;padding:8px;font-weight:700}.option[aria-pressed=true]{border-color:var(--accent);background:var(--selected)}.option[aria-pressed=true]::after{content:' ✓ 已选';font-size:17px}.field{min-width:0;margin-top:14px}.field label{display:block;font-weight:700}input[type=text],input[type=tel],input[type=date],input[type=time],textarea{width:100%;min-height:52px;border:2px solid #8c8578;border-radius:12px;padding:8px 12px;background:white}textarea{min-height:110px;resize:vertical}.fields,.materials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}.materials label{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border:2px solid #8c8578;border-radius:12px;background:white}.materials label:has(input:checked){background:var(--selected);border-color:var(--accent)}.materials input{width:24px;height:24px;flex:none;accent-color:var(--accent)}.hint{font-size:17px;margin:8px 0}.error{color:#9b2c1f;font-weight:700}.primary,.secondary{min-height:56px;padding:10px 20px;border:2px solid var(--accent);border-radius:12px;font-weight:700;line-height:1.4}.primary{background:var(--accent);color:white}.secondary{background:white;color:var(--accent)}.paper-wrap,.result-actions{max-width:740px;margin:auto}.paper{background:white;color:#000;border:2px solid #8c8578;padding:24px 30px;box-shadow:0 4px 14px #00000014;overflow-wrap:anywhere}.paper h2{font-size:24px}.paperhead,.papersection,.paperfoot{border-bottom:2px solid #000;padding:8px 0}.paper-meta{font-size:17px}.contact{font-size:24px;line-height:1.5;font-weight:700}.paper ul{list-style:none;margin:0;padding:0}.paper li{display:flex;gap:10px;break-inside:avoid}.box{width:22px;height:22px;border:2px solid #000;flex:none;margin-top:7px}.paperfoot{border:0;font-size:17px}.result-title{margin-bottom:12px}.result-actions{margin-top:16px}.result-actions>.primary{width:100%}.ways{margin-top:14px;border:2px solid #8c8578;border-radius:12px;background:white}.ways summary{min-height:56px;padding:8px 16px;color:var(--accent);font-weight:700;cursor:pointer}.ways-content{display:grid;gap:12px;padding:0 16px 16px}.ways-content button{width:100%;text-align:left}.ways-content p{font-size:17px;color:#4a4a4a}.preview img{display:block;max-width:100%;height:auto}.preview a{display:inline-flex;align-items:center;min-height:48px}.large{position:fixed;inset:0;z-index:10;background:white;color:black;overflow:auto;padding:16px}.large-inner{max-width:1000px;margin:auto}.large button{border:2px solid black;border-radius:12px;background:white;padding:8px 18px;font-weight:700}.large h2,.large p{font-size:32px;line-height:1.35;padding:8px 0;border-bottom:2px solid black;overflow-wrap:anywhere}.print-root{display:none}@media(max-width:700px){.groups{grid-template-columns:1fr;gap:12px}.date-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.fields,.materials{grid-template-columns:1fr}.paper{padding:16px}.contact{font-size:20px}.primary{width:100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media print{@page{size:A4;margin:15mm 18mm}body{background:white;font:12pt/1.5 "Microsoft YaHei",sans-serif}.wrap,.large{display:none!important}.print-root{display:block}.paper{border:0;box-shadow:none;padding:0;font:12pt/1.5 "Microsoft YaHei",sans-serif}.paper h2{font-size:20pt}.paper-meta,.paperfoot{font-size:10pt}.paperhead,.papersection{padding:4pt 0;border-color:#000}.contact{font-size:14pt;line-height:1.35}.box{width:5mm;height:5mm;margin-top:2pt;border:1.5pt solid black}.paper li{break-inside:avoid;page-break-inside:avoid}}

@media(max-width:700px){.preferences{justify-content:flex-start;gap:8px 16px;padding:10px 0}.pref-group{gap:5px}.pref{padding:5px 8px}.intro{padding:14px 0 18px}.groups{gap:16px;margin-top:18px}.topic{min-height:62px;padding:8px 10px}.group h2{margin-bottom:7px}}

<body><div class="wrap" id="app"><header class="top"><a href="#" class="brand" id="brand">明白</a><button class="back" id="back" hidden>← 返回</button></header><section class="preferences" aria-label="页面显示设置"><div class="pref-group" role="group" aria-label="选择语言"><span class="pref-label">语言</span><button type="button" class="pref lang" data-lang="zh">中文</button><button type="button" class="pref lang" data-lang="en">English</button></div><div class="pref-group" role="group" aria-label="选择配色"><span class="pref-label">配色</span><button type="button" class="pref theme" data-theme="forest"><span class="swatch" aria-hidden="true"></span><span>松绿</span></button><button type="button" class="pref theme" data-theme="clay"><span class="swatch clay" aria-hidden="true"></span><span>暖红</span></button></div></section>
<main id="home" class="page"><div class="intro"><h1 tabindex="-1">把通知，<br>写成一张纸。</h1><p>选一件事，写下知道的，带着纸去办。</p></div><div class="groups" id="groups"></div><a href="#example" class="example" id="example">看看一张纸长什么样 →</a><details class="references"><summary>设计参考与资料</summary><p>参考资料说明设计思路；办事要求以当地机构为准。</p><a href="research.html">查看 10 篇设计与老年人研究资料 →</a></details><footer class="trust">无需注册 · 不联网 · 只在本机处理</footer></main>
<main id="form-page" class="page" hidden><div class="selected"><span id="selected"></span><button class="textbtn" type="button" id="change">改一改</button></div><div class="form-intro"><h1 tabindex="-1">写下知道的事</h1><p>不知道的可以跳过。</p></div><form id="form" novalidate><section class="section"><h2>1. 什么时候去？</h2><div class="date-grid" role="group" aria-label="选择日期"><button type="button" class="option" data-date="today" aria-pressed="false">今天</button><button type="button" class="option" data-date="tomorrow" aria-pressed="false">明天</button><button type="button" class="option" data-date="wednesday" aria-pressed="false">下周三</button><button type="button" class="option" data-date="other" aria-pressed="false">其他</button></div><div class="field" id="date-field" hidden><label for="date">选择日期</label><input id="date" type="date"></div><div class="field"><label for="time">时间（可跳过）</label><input id="time" type="time"></div></section><section class="section"><h2>2. 去哪里，找谁？</h2><div class="fields"><div class="field"><label for="place">地点或联系人</label><input id="place" type="text" maxlength="40" autocomplete="off"></div><div class="field"><label for="phone">联系电话</label><input id="phone" type="tel" maxlength="25" autocomplete="off"></div></div></section><section class="section"><h2>3. 要带什么？</h2><p class="hint">常见材料，办之前先确认。</p><div class="materials" id="materials"></div><div class="field"><label for="extra">还有别的</label><textarea id="extra" maxlength="120" placeholder="一行写一项"></textarea></div><p class="hint">最多写 6 项。</p><p id="form-error" class="error" role="alert"></p></section><button class="primary" type="submit">生成我的办事纸</button></form></main>
<main id="result" class="page" hidden><h1 class="result-title" tabindex="-1" id="result-title">我的办事纸</h1><div class="paper-wrap" id="paper"></div><div class="result-actions"><button class="primary" id="print" type="button">打印这张纸</button><details class="ways" id="ways"><summary>其他方式</summary><div class="ways-content"><div><button class="secondary" id="large-open" type="button">用手机大字卡</button><p>没有打印机也能用。</p></div><div><button class="secondary" id="image" type="button">保存这张图片</button><p>保存不了时可以截图。</p></div><div><button class="secondary" id="share" type="button">给家人看</button><p>链接里有填写的信息。</p></div><div><button class="secondary" id="read" type="button" aria-pressed="false">读给我听</button><p>朗读使用设备语音服务。</p></div><button class="secondary" id="edit" type="button">修改这张纸</button><p id="status" role="status"></p><div id="share-box" hidden><label for="share-text">复制后发给家人</label><textarea id="share-text" readonly></textarea><button class="secondary" id="copy" type="button">复制这段话</button><p id="copy-status" role="status"></p></div><div id="preview" class="preview" hidden><p>长按图片保存，或截图。</p><img id="preview-image" alt="生成的办事纸图片"><a id="download" download="明白办事纸.png">下载图片</a></div></div></details></div></main></div>
<section class="large" id="large" aria-label="手机大字卡" hidden><div class="large-inner"><button id="large-back" type="button">返回</button><div id="large-content"></div></div></section><div class="print-root" id="print-root"></div>
<script>
const names={discharge:'出院后',medical:'医保报销',pension:'养老金资格认证',care:'照护评估',meds:'用药调整',referral:'社区照护转介',aid:'低保 / 困难救助',disability:'残疾证 / 残联',card:'社保卡 / 医保卡',service:'助餐助浴 / 适老化改造',pensionPayment:'养老金到账或金额',other:'其他事项'};
const topics={discharge:{suggest:['出院小结','身份证','用药清单'],steps:['向医生或护士确认回家后的安排。','问清是否需要复诊、何时复诊。','不清楚的用药问题，请问医生或药师。'],say:'您好，我想问一下出院后需要注意什么、什么时候复诊？'},medical:{suggest:['身份证','医保卡','费用发票','费用清单','出院记录'],steps:['先问清办理地点、时间和所需材料。','按经办机构要求准备材料。','提交后询问办理结果如何查询。'],say:'您好，我想问医保报销在哪里办理，需要带什么材料？'},pension:{suggest:['身份证','社保卡','认证通知'],steps:['先问清是否需要认证及截止时间。','确认可以通过什么方式办理。','办理后询问如何确认结果。'],say:'您好，我想问养老金资格认证怎么做，什么时候之前要办？'}};
Object.assign(topics,{care:{suggest:['身份证','病历','用药清单'],steps:['确认评估的时间和地点。','询问需要带的材料。','把需要帮助的日常事情告诉评估人员。'],say:'您好，我想问照护评估在哪里做，需要带什么？'},meds:{suggest:['现在的药盒','新旧药单','病历'],steps:['准备正在使用的药盒或药单。','向医生或药师确认药物和用法。','不清楚时先问医生或药师，不自行调整。'],say:'您好，我想请医生或药师帮我确认药物的用法。'},referral:{suggest:['身份证','评估结果','医保卡'],steps:['确认提供服务的机构和联系人。','询问需要带的材料和服务安排。','说清楚自己希望得到哪些帮助。'],say:'您好，我想问社区照护服务怎么联系，需要准备什么？'},aid:{suggest:['身份证','户口本','收入证明'],steps:['确认要申请或复核的事项。','向社区询问所需材料和办理方式。','提交后询问如何查询结果。'],say:'您好，我想问困难救助怎么办理，需要带什么？'},disability:{suggest:['身份证','残疾证','诊断证明'],steps:['确认要办的是评定、换证还是服务。','询问材料、地点和办理时间。','办理后询问如何查询结果。'],say:'您好，我想问残疾证或相关服务怎么办理？'},card:{suggest:['身份证','旧社保卡','通知原件'],steps:['确认要办的是领卡、换卡、激活还是挂失。','向服务窗口询问需要的材料。','办理后问清下一步和查询方式。'],say:'您好，我想问社保卡的业务在哪里办，需要带什么？'},service:{suggest:['身份证','评估结果','通知原件'],steps:['确认服务机构、联系人和服务项目。','询问服务时间、费用和所需材料。','说清楚自己需要哪些帮助。'],say:'您好，我想问助餐、助浴或居家改造服务怎么申请？'}});
Object.assign(topics,{pensionPayment:{suggest:['身份证','社保卡','通知原件','到账记录'],steps:['核对通知内容和到账记录，不确定的地方记下来。','向社保经办机构确认金额、到账时间和办理方式。','记下答复，并问清下一步如何查询。'],say:'您好，我想问养老金的金额或到账时间发生了变化，该怎么查询？'},other:{suggest:['通知原件','身份证'],steps:['先确认这件事由哪个机构办理。','问清时间、地点和需要准备的材料。','记下答复，并确认下一步怎么做。'],say:'您好，我想咨询一件事，请问需要准备什么、在哪里办理？'}});

const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let topic='',date='',paper=null,example=false,imageURL='',speech=null;const ids=['home','form-page','result'];
const groups=[['看病与用药',['discharge','medical','meds']],['养老金与证件',['pension','pensionPayment','card']],['照护与社区',['care','referral','service']],['生活保障与其他',['aid','disability','other']]];
$('groups').innerHTML=groups.map(([name,items])=>`<section class="group"><h2>${name}</h2><div class="topics">${items.map(k=>`<button class="topic" type="button" data-topic="${k}">${esc(names[k])}</button>`).join('')}</div></section>`).join('');
function stop(){if(speech&&window.speechSynthesis)window.speechSynthesis.cancel();speech=null;$('read').textContent='读给我听';$('read').setAttribute('aria-pressed','false')}
function show(id){stop();ids.forEach(k=>$(k).hidden=k!==id);$('app').hidden=false;$('large').hidden=true;$('back').hidden=id==='home';window.scrollTo(0,0);let h=$(id).querySelector('h1');if(h)h.focus({preventScroll:true})}
function local(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function parse(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return null;let [y,m,d]=s.split('-').map(Number),v=new Date(y,m-1,d);return v.getFullYear()===y&&v.getMonth()===m-1&&v.getDate()===d?v:null}
function dateText(s){let d=parse(s);return d?(lang==='en'?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]}`:`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`):'日期待确认'}
function remaining(s){let d=parse(s);if(!d)return '剩余天数待确认';let now=new Date();now.setHours(0,0,0,0);let n=Math.round((d-now)/86400000);return n===0?'就是今天':n>0?`还有 ${n} 天`:'日期已过，办理前确认'}
function when(p){return dateText(p.date)+(p.time?' '+p.time:'')}
function materialOptions(k,items=[]){$('materials').innerHTML=topics[k].suggest.map((v,i)=>`<label><input type="checkbox" value="${esc(v)}" ${items.includes(v)?'checked':''}><span>${esc(v)}</span></label>`).join('')}
function choose(k){if(!Object.hasOwn(topics,k))return;if(topic!==k){$('form').reset();date='';$('date-field').hidden=true;document.querySelectorAll('.option').forEach(b=>b.setAttribute('aria-pressed','false'));materialOptions(k)}topic=k;example=false;$('selected').textContent='你选的是：'+names[k];$('form-error').textContent='';show('form-page')}
function make(p){let mats=p.materials.length?p.materials:['材料待确认'];return `<article class="paper"><header class="paperhead"><h2>${esc(names[p.topic])}</h2><p>${esc(dateText(p.date))} · ${esc(remaining(p.date))}</p></header><section class="papersection paper-meta"><p>发布单位：待确认</p><p>发布日期：待确认　有效期至：待确认</p></section><section class="papersection"><h3>时间、地点、电话</h3><div class="contact"><p>时间：${esc(when(p))}</p><p>地点：${esc(p.place||'待确认')}</p><p>电话：${esc(p.phone||'待确认')}</p></div></section><section class="papersection"><h3>要带什么</h3><ul>${mats.map(x=>`<li><span class="box" aria-hidden="true"></span><span class="user-data">${esc(x)}</span></li>`).join('')}</ul></section><section class="papersection"><h3>要做什么</h3><ul>${topics[p.topic].steps.slice(0,5).map(x=>`<li><span class="box" aria-hidden="true"></span><span>${esc(x)}</span></li>`).join('')}</ul></section><section class="papersection"><p><b>可以这样问：</b>${esc(topics[p.topic].say)}</p></section><p class="paperfoot">办理前先打上面的电话确认 · 以经办机构为准 · 明白</p></article>`}
function big(p){return `<h2 tabindex="-1">${esc(names[p.topic])}</h2><p><b>时间：</b>${esc(when(p))}</p><p><b>地点：</b>${esc(p.place||'待确认')}</p><p><b>电话：</b>${esc(p.phone||'待确认')}</p><p><b>要带：</b>${esc(p.materials.join('、')||'待确认')}</p><p><b>这样问：</b>${esc(topics[p.topic].say)}</p>`}

function encode(p){let b=new TextEncoder().encode(JSON.stringify(p)),s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decode(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),x=>x.charCodeAt(0))))}
function safe(p){if(!p||p.v!==1||!Object.hasOwn(topics,p.topic)||!Array.isArray(p.materials)||p.materials.length>6)return null;return {v:1,topic:p.topic,date:parse(p.date)?p.date:'',time:typeof p.time==='string'?p.time.slice(0,5):'',place:typeof p.place==='string'?p.place.slice(0,40):'',phone:typeof p.phone==='string'?p.phone.slice(0,25):'',materials:p.materials.filter(x=>typeof x==='string').map(x=>x.slice(0,18))}}

let lang='zh';const originals=new WeakMap(),attrOriginals=new WeakMap();function tr(x){return lang==='en'?(translations[x]||x):x}
function tx(value){let pre=(value.match(/^\s*/)||[''])[0],post=(value.match(/\s*$/)||[''])[0],v=value.trim();if(!v)return value;if(translations[v])return pre+translations[v]+post;if(v.includes(' · ')){let parts=v.split(' · ');if(parts.length===2){let converted=tx(parts[1]);if(converted!==parts[1])return pre+parts[0]+' · '+converted+post}}if(v.startsWith('你选的是：'))return pre+'Selected: '+tr(v.slice(5))+post;let m=v.match(/^还有 (\d+) 天$/);if(m)return pre+m[1]+' days remaining'+post;for(const [a,b] of [['时间：','Time: '],['地点：','Place: '],['电话：','Phone: '],['要带：','Bring: '],['这样问：','Ask: ']])if(v.startsWith(a)){let tail=v.slice(a.length);return pre+b+(tail==='待确认'?'To be confirmed':tail==='日期待确认'?'Date to be confirmed':tail)+post}return value}
function translateTree(root){if(!root)return;let els=[...(root.nodeType===1?[root]:[]),...root.querySelectorAll('*')];for(const el of els){let saved=attrOriginals.get(el)||{};for(const a of ['aria-label','alt','placeholder'])if(el.hasAttribute(a)){if(!(a in saved))saved[a]=el.getAttribute(a);let v=lang==='en'?tx(saved[a]):saved[a];if(el.getAttribute(a)!==v)el.setAttribute(a,v)}attrOriginals.set(el,saved)}let w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);for(let n of nodes){if(n.parentElement.closest('script,style,textarea,input,.user-data'))continue;let v=originals.get(n);if(v===undefined){v=n.nodeValue;originals.set(n,v)}let target=lang==='en'?tx(v):v;if(n.nodeValue!==target)n.nodeValue=target}}
function setLanguage(value){lang=value==='en'?'en':'zh';document.documentElement.lang=lang==='en'?'en':'zh-CN';document.querySelectorAll('.lang').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));translateTree(document.body);if(paper){$('paper').innerHTML=make(paper);$('print-root').innerHTML=make(paper);$('large-content').innerHTML=big(paper);translateTree($('paper'));translateTree($('print-root'));translateTree($('large-content'))}try{localStorage.setItem('mingbai.language',lang)}catch(e){}try{let u=new URL(location.href);if(u.searchParams.has('lang')){u.searchParams.set('lang',lang);history.replaceState(null,'',u.href)}}catch(e){}}
function setTheme(value){value=value==='clay'?'clay':'forest';document.documentElement.dataset.theme=value;document.querySelectorAll('.theme').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===value)));try{localStorage.setItem('mingbai.theme',value)}catch(e){}}
const observer=new MutationObserver(records=>{if(lang!=='en')return;for(const record of records){if(record.type==='characterData'){let n=record.target,old=originals.get(n);if(old!==undefined&&n.nodeValue===tx(old))continue;originals.set(n,n.nodeValue);let target=tx(n.nodeValue);if(target!==n.nodeValue)n.nodeValue=target}else for(const n of record.addedNodes){if(n.nodeType===1)translateTree(n);else if(n.nodeType===3&&n.parentElement&&!n.parentElement.closest('textarea,input,script,style,.user-data')){originals.set(n,n.nodeValue);let target=tx(n.nodeValue);if(target!==n.nodeValue)n.nodeValue=target}}}});observer.observe(document.body,{childList:true,subtree:true,characterData:true});document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLanguage(b.dataset.lang));document.querySelectorAll('.theme').forEach(b=>b.onclick=()=>setTheme(b.dataset.theme));try{setTheme(localStorage.getItem('mingbai.theme'))}catch(e){setTheme('forest')}try{setLanguage(new URLSearchParams(location.search).get('lang')==='en'?'en':localStorage.getItem('mingbai.language')||'zh')}catch(e){setLanguage('zh')}
